name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle (네트워크 지연 대비 재시도)
        run: |
          for i in 1 2 3; do ./gradlew --version && break || sleep 20; done

      - name: Unit tests (학습 로직 + 화면 흐름)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Restore signing key (Secrets에 KEYSTORE_BASE64가 있을 때)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/family.jks
            echo "서명 키 복원 완료"
          else
            echo "서명 키 없음: debug 키로 서명합니다"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "english-speaking-${VERSION}.apk"
          echo "APK=english-speaking-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: english-speaking-apk
          path: ${{ env.APK }}

      - name: Attach to GitHub Release (v* 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
